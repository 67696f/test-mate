name: evals

# This workflow had never run once. It was pull_request-only, and this repository's
# history is direct pushes to main, so the suite that guards the prompt surface was
# guarding nothing. Pushes to main now trigger it too.
#
# It is not free: a full suite is about four and a half minutes and has cost between
# $2.13 and $6.33, against the same account limit a developer is using. The path filter
# is what keeps that bounded -- a README or CI edit does not pay for an eval run.
on:
  pull_request:
    paths: &eval_paths
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'hooks/**'
      - 'evals/**'
      - '.claude-plugin/**'
  push:
    branches: [main]
    paths: *eval_paths
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # Without a credential the suite cannot run, and a workflow that fails on every
      # push is worse than one that never fires -- people learn to ignore it, which is
      # how this workflow came to sit dormant and unnoticed in the first place. Say so
      # once, clearly, and pass. The `secrets` context is not available to a job-level
      # `if`, so the check has to live in a step the others depend on.
      - name: Check for a credential
        id: cred
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not configured for this repository, so the"\
                 "eval suite did not run. Add it in Settings > Secrets and variables > Actions."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cred.outputs.have == 'true'

      - name: Install Claude Code
        if: steps.cred.outputs.have == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the eval suite
        if: steps.cred.outputs.have == 'true'
        # The exit code is deliberately ignored here. `claude plugin eval` exits 1 both
        # for a case that scored badly and for a run that never happened -- a session or
        # rate limit writes a well-formed report in which every case reads 0.0. Only the
        # next step can tell those apart, so it is the one that decides.
        run: |
          claude plugin eval . \
            --trust-plugin \
            --no-publish \
            --ablation none \
            --concurrency 4 \
            --json evals-result.json || true

      - name: Judge the result
        if: steps.cred.outputs.have == 'true'
        # Exit 1 = a case genuinely scored below the bar. Exit 2 = the run produced no
        # usable evidence and must be rerun rather than recorded. Both fail the job; only
        # one of them is a verdict on the plugin.
        #
        # --threshold 0.8 tolerates the skill-fired grader on matches-existing-conventions
        # missing one run in six; every other case is expected at 1.00.
        run: python3 evals/check_results.py evals-result.json --threshold 0.8

      - uses: actions/upload-artifact@v7
        if: always() && steps.cred.outputs.have == 'true'
        with:
          name: eval-results
          path: |
            evals-result.json
            evals/results/
