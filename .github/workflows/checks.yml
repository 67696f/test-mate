name: checks

# Fast, credential-free, and runs on everything. The eval suite (evals.yml) needs a
# Claude credential and four minutes; this needs neither, so it is the gate that
# always runs.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hooks run wherever Claude Code does, so they must work on whatever
        # python3 the user happens to have. Stdlib only, no dependencies to install.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Hook and integrity tests
        run: python3 -m unittest discover -s tests -v

      - name: Hooks compile and are stdlib-only
        run: |
          python3 -m compileall -q hooks/
          # Any third-party import would break on a user's machine. Parsed with ast
          # rather than grepped: the previous grep passed -E and -P together, which GNU
          # grep rejects with exit 2, and `if grep ...` reads a nonzero exit as "clean",
          # so the gate was green no matter what the hooks imported.
          python3 - <<'EOF'
          import ast, pathlib, sys

          ALLOWED = {"json", "os", "re", "sys", "fnmatch"}
          bad = []
          for path in sorted(pathlib.Path("hooks").rglob("*.py")):
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      # Compare the top-level package: "os.path" is os, and "requests"
                      # is not "re" -- the old lookahead matched on prefix and let
                      # requests, redis and friends through.
                      if name.split(".")[0] not in ALLOWED:
                          bad.append(f"{path}:{node.lineno}: {name}")
          for entry in bad:
              print(f"::error::hooks must import stdlib only -- {entry}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Manifests parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   hooks/hooks.json examples/config.example.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
            echo "ok $f"
          done

      - name: Version matches the changelog
        if: matrix.python-version == '3.12'
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::plugin.json is $version but CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "ok: $version is in the changelog"
